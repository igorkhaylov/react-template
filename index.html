<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Production-ready React + TypeScript template" />
    <link rel="manifest" href="/manifest.json" />
    <title>React Template</title>
    <!-- Apply the theme before anything renders so a dark-mode user never sees a
         light flash. Mirrors src/features/theme-switcher/theme.ts (storage guarded:
         localStorage can throw when the browser blocks site data). -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {
        /* storage blocked: default to light */
      }
    </script>
    <!-- Runtime env vars: regenerated at container start in Docker, dev fallback in public/.
         Must load BEFORE the app bundle so window.__ENV__ is ready when src/env.ts runs. -->
    <script src="/env-config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
