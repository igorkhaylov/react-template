# Security headers shared by every location. nginx's add_header inheritance stops
# at the FIRST add_header inside a location, so any location that sets its own
# header (e.g. Cache-Control) must re-include this file — see nginx.conf.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
