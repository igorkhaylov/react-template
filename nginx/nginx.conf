server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. NOTE: nginx add_header inheritance stops at the first
    # add_header inside a location, so these are repeated where index.html is served.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Health check endpoint for Docker / orchestrators
    location = /healthz {
        access_log off;
        return 204;
    }

    # index.html must never be cached: a stale copy would reference hashed asset
    # URLs from a previous deploy. SPA routes land here via the fallback below.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # env-config.js is regenerated on every container start (runtime env vars) —
    # never cache it. Exact match wins over the static-asset regex below.
    location = /env-config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Unhashed files from public/ (stable URLs, mutable content) get a short
    # cache so replacing them takes effect within a day. Exact matches win over
    # the immutable regex below.
    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public";
    }
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Long-term caching for static assets (Vite emits content-hashed filenames)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
