server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers live in security-headers.conf (Dockerfile copies it to
    # /etc/nginx/snippets/). NOTE: nginx add_header inheritance stops at the first
    # add_header inside a location, so every location below that sets its own
    # header re-includes the file.
    include /etc/nginx/snippets/security-headers.conf;

    # Content-Security-Policy is deliberately not enabled by default — the right
    # policy is app-specific: the inline theme script in index.html needs a hash or
    # 'unsafe-inline', connect-src must list the API origin, etc. Starting point:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.example.com" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Health check endpoint for Docker / orchestrators
    location = /healthz {
        access_log off;
        return 204;
    }

    # index.html must never be cached: a stale copy would reference hashed asset
    # URLs from a previous deploy. SPA routes land here via the fallback below.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # env-config.js is regenerated on every container start (runtime env vars) —
    # never cache it. Exact match wins over the static-asset regex below.
    location = /env-config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Unhashed files from public/ (stable URLs, mutable content) get a short
    # cache so replacing them takes effect within a day. Exact matches win over
    # the immutable regex below.
    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Deny access to hidden files. Must come BEFORE the static-asset regex: for
    # regex locations the first match in file order wins, and a dotfile ending in
    # .js (e.g. /.foo.js) would otherwise be served by the asset rule.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Long-term caching for static assets (Vite emits content-hashed filenames)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
