name: Build and push frontend image

# Builds the frontend Docker image (linux/amd64 + linux/arm64) and pushes it to the
# GitHub Container Registry (ghcr.io). The deploy server never builds — it only
# pulls this image (see docker-compose.prod.yml + `make prod deploy`).
#
# Tags produced:
#   - latest            (only on the default branch)
#   - sha-<full-sha>    (every build — use this to pin an exact commit in prod)
#   - vX.Y.Z / X.Y.Z    (when a git tag like v1.2.3 is pushed)

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

# Queue overlapping builds of the same ref instead of cancelling: a cancelled
# multi-arch push could leave a partially updated manifest behind.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the image is only built/pushed if the same checks as every PR pass.
  # Defined once in ci.yml (workflow_call) so the two cannot drift apart.
  quality:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    # The arm64 half runs under QEMU emulation — an uncached build is slow.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # github.repository keeps the owner/repo casing as typed on GitHub, but Docker
      # refs must be lowercase — lowercase it before it reaches the image name.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # QEMU provides the arm64 emulation for the multi-platform build below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Match `make push`: the server can be either architecture.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Vulnerability gate: scans the image that was just pushed. Runs AFTER the push —
  # the image is already in the registry, but deploys are manual and pin a tag, so a
  # red scan here is the signal not to roll it out.
  scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          # Alpine CVEs without an upstream fix would otherwise block every build.
          ignore-unfixed: true
